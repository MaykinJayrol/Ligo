services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashin
      POSTGRES_PASSWORD: cashin
      POSTGRES_DB: cashin
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashin -d cashin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
